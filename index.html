<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e34c69" />
  <title>怜爱.top</title>
  <style>
    :root { --wine: #b71336; --red: #e52c55; --cream: #fff9f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; overflow: hidden; color: #5a1425; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #fff0f3; }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    .scene { position: fixed; inset: 0; display: grid; place-items: center; transition: opacity 850ms ease, transform 850ms ease; }
    #intro { z-index: 2; background: radial-gradient(circle at 50% 42%, #fff6f6 0 14%, #ffd8df 48%, #e84b69 150%); }
    #intro.out { opacity: 0; transform: scale(1.12); pointer-events: none; }
    .intro-note { position: absolute; bottom: 9%; color: #a32843; font-size: 15px; letter-spacing: .22em; opacity: .75; }
    #heart-field { position: relative; width: min(82vw, 390px); aspect-ratio: 1 / .92; }
    .particle { position: absolute; left: var(--x); top: var(--y); color: var(--red); font-size: clamp(10px, 3vw, 18px); line-height: 1; opacity: 0; transform: translate(-50%, -50%) scale(.08); filter: drop-shadow(0 2px 1px rgba(129,0,25,.14)); animation: gather .38s cubic-bezier(.2,.85,.2,1) forwards; }
    @keyframes gather { to { opacity: 1; transform: translate(-50%, -50%) scale(var(--s)); } }
    #letter { z-index: 1; opacity: 0; transform: rotateY(-16deg) scale(.97); pointer-events: none; background: radial-gradient(ellipse at 14% 19%, rgba(255,255,255,.95) 0 2%, transparent 9%), radial-gradient(ellipse at 83% 26%, rgba(255,255,255,.78) 0 3%, transparent 12%), radial-gradient(ellipse at 23% 79%, rgba(249,128,162,.33) 0 4%, transparent 16%), radial-gradient(ellipse at 77% 83%, rgba(255,255,255,.8) 0 2%, transparent 12%), linear-gradient(145deg, #ffd5e0 0%, #fff6f7 49%, #f9b6c9 100%); }
    #letter.in { opacity: 1; transform: none; pointer-events: auto; }

    /* 中间新增的4秒文字页面 */
    #middle-page {
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.04);
      background:
        radial-gradient(circle at 50% 40%, rgba(255,255,255,.92) 0 10%, rgba(255,225,232,.72) 38%, rgba(235,120,150,.55) 100%),
        linear-gradient(135deg, #ffdce5 0%, #fff4f6 48%, #f5b5c8 100%);
      transition: opacity 850ms ease, transform 850ms ease;
    }

    #middle-page.show {
      opacity: 1;
      pointer-events: auto;
      transform: none;
    }

    .middle-card {
      width: min(88vw, 500px);
      padding: 42px 28px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 30px;
      background: rgba(255,250,252,.72);
      box-shadow: 0 16px 55px rgba(112,12,38,.22);
      backdrop-filter: blur(4px);
    }

    .middle-heart {
      display: block;
      margin-bottom: 22px;
      color: var(--red);
      font-size: 30px;
      animation: beat 1.35s ease-in-out infinite;
    }

    #middle-message {
      margin: 0;
      font-size: clamp(19px, 5vw, 26px);
      font-weight: 500;
      line-height: 1.95;
      letter-spacing: .05em;
      color: #64182b;
      text-shadow: 0 1px #fff;
    }

    #middle-message span {
      opacity: 0;
      animation: middleAppear .12s ease forwards;
    }

    @keyframes middleAppear {
      to { opacity: 1; }
    }

    .veil { position: absolute; inset: 0; background: rgba(255, 250, 249, .22); backdrop-filter: blur(1px); }
    .card { position: relative; width: min(88vw, 460px); padding: 48px 25px 38px; text-align: center; border: 1px solid rgba(255,255,255,.8); border-radius: 30px; background: rgba(255, 251, 251, .76); box-shadow: 0 14px 50px rgba(112, 12, 38, .22); }
    .tiny-heart { display: block; margin-bottom: 20px; color: var(--red); font-size: 27px; animation: beat 1.35s ease-in-out infinite; }
    @keyframes beat { 50% { transform: scale(1.16); } }
    h1 { min-height: 7.8em; margin: 0; font-size: clamp(20px, 5.4vw, 27px); font-weight: 500; line-height: 1.9; letter-spacing: .06em; text-shadow: 0 1px #fff; }
    h1 span { opacity: 0; animation: appear .01s forwards; }
    @keyframes appear { to { opacity: 1; } }
    .choices { display: flex; align-items: center; justify-content: center; gap: clamp(12px, 5vw, 30px); min-height: 104px; margin-top: 17px; }
    .heart-btn { --scale: 1; position: relative; width: 112px; height: 100px; border: 0; padding: 0 15px 7px; color: white; font-size: 15px; font-weight: 700; line-height: 1.3; cursor: pointer; background: var(--red); clip-path: path('M56 94 C47 82 5 58 5 28 C5 3 35 -5 56 17 C77 -5 107 3 107 28 C107 58 65 82 56 94 Z'); transform: scale(var(--scale)); transition: transform .35s cubic-bezier(.2,.9,.2,1), filter .2s; filter: drop-shadow(0 7px 5px rgba(130, 9, 37, .22)); }
    .heart-btn:active { filter: brightness(.9); }
    #no { background: #d88398; }
    .final-choice { margin: 26px auto 6px; }
    .hidden { display: none !important; }
    #modal { z-index: 5; opacity: 0; pointer-events: none; background: rgba(86, 6, 25, .47); transition: opacity .45s; }
    #modal.show { opacity: 1; pointer-events: auto; }
    .modal-box { width: min(82vw, 360px); padding: 37px 24px 28px; text-align: center; border-radius: 27px; background: #fff9fa; box-shadow: 0 15px 50px rgba(56,0,12,.35); transform: translateY(15px) scale(.94); transition: .45s cubic-bezier(.2,.9,.2,1); }
    #modal.show .modal-box { transform: none; }
    .modal-box b { display: block; color: var(--red); font-size: 28px; margin-bottom: 13px; }
    .modal-box p { margin: 0 0 24px; font-size: 17px; line-height: 1.65; }
    .close { border: 0; border-radius: 99px; padding: 12px 24px; background: var(--wine); color: white; cursor: pointer; }
    @media (max-height: 610px) {
      .middle-card { padding: 28px 20px; }
      #middle-message { line-height: 1.7; }
      .card { padding: 25px 18px 20px; } .tiny-heart { margin-bottom: 8px; } h1 { min-height: 6.1em; line-height: 1.65; } .choices { margin-top: 3px; min-height: 84px; } .heart-btn { transform: scale(calc(var(--scale) * .85)); } }
  </style>
</head>
<body>
  <section class="scene" id="intro" aria-label="爱心正在出现">
    <div id="heart-field" aria-hidden="true"></div>
  </section>
  <main class="scene" id="letter">
    <div class="veil"></div>
    <section class="card">
      <span class="tiny-heart">♥</span>
      <h1 id="message"></h1>
      <div class="choices" id="choices">
        <button class="heart-btn" id="yes">愿意相信</button>
        <button class="heart-btn" id="no">你放屁</button>
      </div>
    </section>
  </main>

  <!-- 原来的第1页和第2页之间新增的4秒页面 -->
  <section class="scene" id="middle-page" aria-label="给怜爱的话">
    <div class="middle-card">
      <span class="middle-heart">♥</span>
      <p id="middle-message"></p>
    </div>
  </section>

  <section class="scene" id="modal" role="dialog" aria-modal="true">
    <div class="modal-box"><b>♥</b><p id="modal-text"></p><button class="close" id="close">手动关闭</button></div>
  </section>
  <script>
    const field = document.querySelector('#heart-field');
    // 用心形参数方程勾勒大爱心边缘；中间留白，按「从上到下、从左到右」依次显现。
    // 最后一颗的动画在第 4 秒结束，随后立刻翻页。
    for (let i = 0; i < 210; i++) {
      const t = Math.random() * Math.PI * 2;
      // r 接近 1，形成有自然厚度的轮廓，而不是填充整颗心。
      const r = .94 + Math.random() * .06;
      const x = 16 * Math.pow(Math.sin(t), 3) * r;
      const y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)) * r;
      const p = document.createElement('i'); p.className = 'particle'; p.textContent = '♥';
      p.style.setProperty('--x', `${50 + x * 2.65}%`); p.style.setProperty('--y', `${50 + y * 2.5}%`);
      p.style.setProperty('--s', (0.65 + Math.random() * .75).toFixed(2));
      const topToBottom = Math.max(0, Math.min(1, (y + 12) / 30));
      const leftToRight = Math.max(0, Math.min(1, (x + 16) / 32));
      p.style.animationDelay = `${topToBottom * 3420 + leftToRight * 120}ms`;
      field.appendChild(p);
    }
    const intro = document.querySelector('#intro'), letter = document.querySelector('#letter');
    const middlePage = document.querySelector('#middle-page');
    const words = '宝宝，从始至终你都是我的唯一，是我生活不可或缺的一部分，我不会再胡来了，你愿意相信我吗？';
    const middleWords = '怜爱，你美丽动人，性情温柔，嗓音清甜悦耳，又自带风趣幽默。和你相处十分舒心，你的一言一行都让人觉得温暖又治愈，你是我永远的小宝宝。';

    // 第1页4秒结束后，先进入新增的中间页面
    setTimeout(() => {
      intro.classList.add('out');
      middlePage.classList.add('show');
      typeMiddleMessage();

      // 中间页面固定4秒，然后进入原来的第2页
      setTimeout(() => {
        middlePage.classList.remove('show');
        letter.classList.add('in');
        typeMessage();
      }, 4000);
    }, 4000);

    function typeMessage() {
      const box = document.querySelector('#message');
      [...words].forEach((ch, i) => {
        const span = document.createElement('span');
        span.textContent = ch;
        span.style.animationDelay = `${i * 58}ms`;
        box.appendChild(span);
      });
    }

    function typeMiddleMessage() {
      const box = document.querySelector('#middle-message');
      box.innerHTML = '';
      [...middleWords].forEach((ch, i) => {
        const span = document.createElement('span');
        span.textContent = ch;
        span.style.animationDelay = `${i * 58}ms`;
        box.appendChild(span);
      });
    }

    const yes = document.querySelector('#yes'), no = document.querySelector('#no'), choices = document.querySelector('#choices'); let refusals = 0;
    yes.onclick = () => finish('永远爱你，么么哒老婆。');
    no.onclick = () => { refusals++; if (refusals < 4) { yes.style.setProperty('--scale', 1 + refusals * .48); no.style.setProperty('--scale', Math.max(.18, 1 - refusals * .28)); } else { choices.innerHTML = '<button class="heart-btn final-choice" id="final-yes">请宝宝相信我，骗人是小狗</button>'; document.querySelector('#final-yes').onclick = () => finish('永远爱你，么么哒老婆。'); setTimeout(() => finish('请宝宝相信我，骗人是小狗。'), 2600); } };
    function finish(text) { document.querySelector('#modal-text').textContent = text; document.querySelector('#modal').classList.add('show'); }
    document.querySelector('#close').onclick = () => { window.close(); document.querySelector('#modal-text').textContent = '页面可以手动关闭啦。'; };
  </script>
</body>
</html>
