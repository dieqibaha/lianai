<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17251f">
  <meta name="description" content="一段可以亲手探索的列车小旅程。">
  <title>月台之间 · 互动旅程</title>
  <link rel="stylesheet" href="assets/game.css">
  <script defer src="assets/world.js"></script>
  <script defer src="assets/game.js"></script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="fc6b6143-3977-4504-9a82-97f220290945"></script>
</head>
<body>
  <main class="game" id="game" aria-label="月台之间互动游戏">
    <div class="world" id="world"></div>
    <header class="hud">
      <div class="location-chip"><span class="live-dot"></span><span id="location-name">沿海线</span></div>
      <button class="map-toggle" id="map-toggle" data-interact="map" aria-label="打开旅程地图" title="旅程地图">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 6 5-2 8 2 5-2v14l-5 2-8-2-5 2V6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 4v14m8-12v14" stroke="currentColor" stroke-width="1.6"/></svg><span>地图</span>
      </button>
    </header>
    <section class="dialogue" id="dialogue" aria-live="polite" hidden>
      <div class="dialogue-avatar" id="dialogue-avatar">✦</div>
      <div class="dialogue-copy"><span id="dialogue-speaker"></span><p id="dialogue-line"></p></div>
      <button class="dialogue-close" data-interact="close-dialogue" aria-label="关闭对话">×</button>
    </section>
    <div class="ride-transition" id="ride-transition" aria-hidden="true">
      <div class="ride-light"></div><div class="ride-title" id="ride-title">列车正在出发</div><div class="ride-rail"></div>
      <div class="ride-train"><span></span><i></i><i></i><i></i></div>
    </div>
  </main>
</body>
</html>
